<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MovieFinder</title>
  <link rel="apple-touch-icon" sizes="180x180" href="./img/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./img/favicon-16x16.png">
  <link rel="manifest" href="./img/site.webmanifest">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Mulish:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- HEADER-->
<header>
  <div class="header-inner">
    <div class="logo">Movie<span>Finder</span></div>
    <div class="search-wrap">
      <input type="text" id="search-input" placeholder="Поиск фильма..." autocomplete="off" />
      <button class="search-btn" id="search-btn" title="Найти">&#9906;</button>
    </div>
  </div>
</header>

<!-- MAIN -->
<main>
  <div class="section-title" id="section-label">Популярное</div>

  <div id="error-msg"></div>

  <div id="spinner">
    <div class="spin-ring"></div>
    <span>Загружаем фильмы…</span>
  </div>

  <div id="empty">
    <svg width="64" height="64" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      <line x1="8" y1="11" x2="14" y2="11"/>
    </svg>
    <span>Ничего не найдено</span>
  </div>

  <div id="grid"></div>
</main>

<!--  MODAL -->
<div id="modal-backdrop">
  <div id="modal">
    <button class="modal-close" id="modal-close">✕</button>
    <div class="modal-hero" id="modal-hero"></div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/app.js"></script>

</body>
</html>
